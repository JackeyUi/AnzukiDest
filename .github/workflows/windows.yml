name: Windows desktop release
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'pet/**'
      - 'scripts/**'
      - 'materials/voice-v1/**'
      - 'LICENSE'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Find previous successful Windows bundle
        id: baseline
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'windows.yml', status: 'success', per_page: 20});
            for (const run of runs.data.workflow_runs) {
              if (run.id === context.runId) continue;
              const result = await github.rest.actions.listWorkflowRunArtifacts({owner: context.repo.owner, repo: context.repo.repo, run_id: run.id});
              if (result.data.artifacts.some(a => a.name === 'Anzuki-Windows-x64' && !a.expired)) { core.setOutput('run-id', String(run.id)); return; }
            }
            throw new Error('No previous Windows bundle is available for incremental update validation');
      - uses: actions/download-artifact@v4
        with:
          name: Anzuki-Windows-x64
          path: .local/windows-baseline
          github-token: ${{ github.token }}
          run-id: ${{ steps.baseline.outputs.run-id }}
      - name: Install pinned packaging and test tools
        shell: pwsh
        run: npm install --prefix .local/windows-tools --no-save @electron/packager@18.3.6 @electron/asar@3.4.1 @electron/fuses@1.8.0 playwright@1.56.1
      - name: Verify playback and voice rules
        shell: pwsh
        run: |
          node scripts/check-playback.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/check-voice.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/check-custom-animation.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/check-frame-clock.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/check-behavior.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package standalone Windows EXE with unchanged artwork
        run: node scripts/build-windows.cjs
      - name: Verify packaged executable and every asset byte
        run: node scripts/check-windows-package.cjs
      - name: Smoke-test actual packaged Windows app
        run: node scripts/check-windows-smoke.cjs
      - name: Build minimal update and apply it to previous bundle
        env:
          ANZUKI_BASE_RUN: ${{ steps.baseline.outputs.run-id }}
        run: node scripts/build-windows-update.cjs
      - name: Verify incrementally updated application
        run: node scripts/check-windows-package.cjs .local/windows-patched
      - name: Smoke-test actual incrementally updated EXE
        run: node scripts/check-windows-smoke.cjs .local/windows-patched
      - uses: actions/upload-artifact@v4
        with:
          name: Anzuki-Windows-Update
          path: .local/windows-update/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: Anzuki-Windows-x64
          path: .local/windows-release/Anzuki-win32-x64/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Anzuki-Windows-validation
          path: |
            .local/windows-release/windows-smoke.png
            .local/windows-release/media-settings.png
            .local/windows-release/playback-metrics*.json
          if-no-files-found: ignore
          retention-days: 30
