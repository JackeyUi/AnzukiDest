name: Android + desktop sync
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'pet/**'
      - 'scripts/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install native build tools and media dependencies
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install numpy scipy pillow
      - name: Verify committed desktop and Android assets
        run: python scripts/check-platform-sync.py --assets-only
      - name: Build Android APK from the shared desktop clips
        run: python android/build.py --sdk "$ANDROID_HOME"
      - name: Verify packaged synchronization
        run: python scripts/check-platform-sync.py
      - uses: actions/upload-artifact@v4
        with:
          name: Anzuki-Android-test-APK
          path: |
            android/releases/Anzuki-Android.apk
            android/releases/apk-metadata.json
          retention-days: 30
