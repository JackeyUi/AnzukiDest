<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>Anzuki 動畫與音聲設定</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
<link rel="stylesheet" href="settings.css"></head><body><h1>動畫與音聲設定</h1>
<button id="recover-pet" type="button">顯示桌寵／回到右下角</button><p>拖到底部放開可收起；從系統匣叫回。</p>
<label for="idle">待機動畫</label><select id="idle"><option value="idle-loop-long">長循環</option><option value="idle-loop-short">短循環</option></select>
<label for="click-animation">點擊動畫</label><select id="click-animation"><option value="builtin">內建隨機</option></select>
<section id="custom-animations"><h2>自訂動畫</h2><p>匯入透明動態 WebP，加入後自動套用。</p><div class="clip-actions"><button id="import-idle">加入待機動畫</button><button id="import-click">加入點擊動畫</button></div><div id="animation-library"></div><p id="animation-status" role="status" aria-live="polite"></p></section>
<label for="speed">點擊動畫速度 <output id="speed-label" for="speed">1.0×</output></label>
<input id="speed" type="range" min="1" max="2" step="0.1" value="1"><div class="ends"><span>1.0×</span><span>2.0×</span></div>
<p>自動儲存，下次點擊生效。抓起、落地固定 2 倍速。</p>
<section><h2>小憩與隨機動作</h2>
<label class="check"><input id="nap-enabled" type="checkbox" checked>鼠標靜止後自動小憩</label>
<label for="nap-minutes">小憩等待時間 <output id="nap-minutes-label">10 分鐘</output></label><input id="nap-minutes" type="range" min="5" max="30" step="1" value="10">
<p>點擊、拖曳角色或按「喚醒」結束小憩。</p>
<label class="check"><input id="auto-enabled" type="checkbox" checked>定時隨機播放其他動作</label>
<label for="action-minutes">隨機動作間隔 <output id="action-minutes-label">10 分鐘</output></label><input id="action-minutes" type="range" min="5" max="30" step="1" value="10">
<p>隨機播放拿書、扶帽子或抓星星；小憩及拖曳時暫停。</p>
<label for="manual-animation">主動播放</label><select id="manual-animation"></select><div class="clip-actions"><button id="play-animation">播放選擇的動畫</button><button id="wake-animation">喚醒／回到呼吸</button></div></section>
<section id="voice-settings"><h2>角色音聲</h2>
<label class="check"><input id="voice-muted" type="checkbox">靜音</label>
<label for="voice-volume">音聲音量 <output id="voice-volume-label">70%</output></label><input id="voice-volume" type="range" min="0" max="100" step="1" value="70">
<label class="check"><input id="voice-idle-enabled" type="checkbox">待機時自動閒聊</label>
<label for="voice-interval">閒聊間隔 <output id="voice-interval-label">3 分鐘</output></label><input id="voice-interval" type="range" min="1" max="10" step="1" value="3">
<p>依日期與時段隨機播放。聲音播完前不打斷、不排隊。</p>
<p>僅接受音檔，每檔最多 50 MB。平日：週一～週五；假日：週六、週日。</p>
<section id="animation-voice-settings"><h2>動畫聲音</h2><p>進入動畫時播一次，循環不重播。</p><label for="animation-voice-choice">選擇動畫</label><select id="animation-voice-choice"></select><div id="animation-voice-clips"></div></section><div id="voice-clips"></div><button id="voice-stop" type="button">停止試聽</button><p id="voice-status" role="status" aria-live="polite"></p></section>
<script src="settings.js"></script></body></html>
