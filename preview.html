<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anzuki · 星光桌寵</title>
<style>
:root{color-scheme:dark;--ink:#e6edff;--muted:#a1b1ce;--line:#303e5a;--gold:#dfc78c}*{box-sizing:border-box}body{margin:0;background:#0c1325;color:var(--ink);font:16px/1.65 system-ui,sans-serif}main{max-width:1040px;margin:auto;padding:42px 24px}header{display:flex;align-items:center;gap:24px;justify-content:space-between}h1{font-size:40px;line-height:1.2;margin:8px 0 12px;font-weight:600}h2{font-size:20px}p{color:var(--muted);margin:8px 0}.eyebrow{color:var(--gold);font-size:12px;letter-spacing:3px}button,a{color:inherit}button{font:inherit;border:1px solid var(--line);border-radius:99px;background:#17233a;padding:8px 18px;cursor:pointer}button:hover,button[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}.stage{position:relative;overflow:hidden;min-height:390px;border:1px solid var(--line);border-radius:24px;margin:26px 0 14px;background-color:#182238;background-image:linear-gradient(45deg,#1d2940 25%,transparent 25%),linear-gradient(-45deg,#1d2940 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#1d2940 75%),linear-gradient(-45deg,transparent 75%,#1d2940 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0}.stage.light{background-color:#e7eaf1;background-image:linear-gradient(45deg,#d4dbe6 25%,transparent 25%),linear-gradient(-45deg,#d4dbe6 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#d4dbe6 75%),linear-gradient(-45deg,transparent 75%,#d4dbe6 75%)}#pet{display:block;width:min(100%,700px);margin:auto;touch-action:none;cursor:grab;user-select:none}#pet:active{cursor:grabbing}.caption{position:absolute;bottom:16px;left:20px;font-size:13px;color:#adc0df;background:#0c1325d9;padding:5px 12px;border-radius:20px}.controls{display:flex;gap:8px;flex-wrap:wrap}.note{font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}.card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#141e33}.card video{display:block;width:100%}.card strong{display:block;padding:0 16px 12px;font-weight:500}footer{border-top:1px solid var(--line);margin-top:32px;padding-top:20px;font-size:13px;color:var(--muted)}footer a{color:var(--gold)}#error{display:none;color:#f1b3ad}@media(max-width:650px){header{display:block}h1{font-size:32px}.grid{grid-template-columns:repeat(2,1fr)}.stage{min-height:250px}}
</style>
<main>
<header><div><div class="eyebrow">A LITTLE STARDUST, ALWAYS WITH YOU</div><h1>Anzuki · 星光桌寵</h1><p>把一點星光，留在你的桌面。</p></div><button id="theme">切換背景</button></header>
<div class="stage" id="stage"><video id="pet" muted loop autoplay playsinline aria-label="Anzuki 動作預覽" src="pet/anzuki-animation/idle-loop-long.webm"></video><span class="caption" id="caption">長循環待機 · 點擊角色播放彈動</span></div>
<div class="controls" id="controls"></div>
<p class="note">這裡是瀏覽器預覽。桌面啟動請開啟 Start-Windows.cmd，或執行 start.sh。需先安裝 Node.js 22.12 以上版本。</p>
<p id="error">影片未能播放，請使用 Chrome、Edge 或 Firefox 開啟本檔案。</p>
<h2>影片動作預覽</h2><div class="grid" id="grid"></div>
<footer>由你提供的綠幕影片製作的透明動畫素材包。<br>桌寵引擎與格式：<a href="https://github.com/PC2005-cloud/dsh-pet">PC2005-cloud / dsh-pet</a> · <a href="README.md">安裝說明</a></footer>
</main>
<script>
const actions=[['idle-loop-long','待機長循環'],['idle-loop-short','待機短循環（備用）'],['click-bounce-1','點擊彈動一'],['click-bounce-2','點擊彈動二']];
const pet=document.querySelector('#pet'),stage=document.querySelector('#stage');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
for(const [name,label] of actions){
 const button=document.createElement('button');button.textContent=label;button.dataset.name=name;button.setAttribute('aria-pressed',name==='idle-loop-long');
 button.onclick=()=>{pet.loop=!name.startsWith('click-');pet.src=`pet/anzuki-animation/${name}.webm`;pet.play().catch(()=>{});document.querySelector('#caption').textContent=label+' · 可拖曳預覽';document.querySelectorAll('#controls button').forEach(b=>b.setAttribute('aria-pressed',b===button));};
 document.querySelector('#controls').append(button);
 const card=document.createElement('div');card.className='card';const v=document.createElement('video');v.src=`pet/anzuki-animation/${name}.webm`;v.muted=true;v.loop=true;v.autoplay=!reduce;v.playsInline=true;v.controls=true;v.preload='metadata';v.setAttribute('aria-label',label);const title=document.createElement('strong');title.textContent=label;card.append(v,title);document.querySelector('#grid').append(card);
}
document.querySelector('#theme').onclick=()=>stage.classList.toggle('light');
pet.addEventListener('error',()=>document.querySelector('#error').style.display='block');
let held=null,x=0,y=0;
pet.onpointerdown=e=>{held={px:e.clientX,py:e.clientY,x,y};pet.setPointerCapture(e.pointerId);};
pet.onpointermove=e=>{if(!held)return;x=Math.max(-160,Math.min(160,held.x+e.clientX-held.px));y=Math.max(-70,Math.min(50,held.y+e.clientY-held.py));pet.style.transform=`translate(${x}px,${y}px)`;};
pet.onpointerup=e=>{const tap=held&&Math.hypot(e.clientX-held.px,e.clientY-held.py)<5;held=null;if(tap){const name=Math.random()<.5?'click-bounce-1':'click-bounce-2';document.querySelector(`[data-name="${name}"]`).click();}};
pet.onpointercancel=()=>held=null;
pet.onended=()=>document.querySelector('[data-name="idle-loop-long"]').click();
if(reduce){pet.autoplay=false;pet.pause();}
</script>
</html>
